# Keeps the website's live fires fresh around the clock, with no laptop and without relying on
# GitHub's scheduled runs (which GitHub may delay or drop). One watcher at a time checks NASA's
# near-real-time feed every 5 minutes and asks for a website rebuild when NASA has newer data
# (pipeline/keeper.py). After ~5.5 hours it starts its own successor and ends. If the chain ever
# breaks, it is restarted by the schedule below, by every website build, and by the local server.
# Runs as the owner via the FIRECAL_PUBLISH_TOKEN secret (fine-grained, this repository only).
name: Keep live fires fresh

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this watcher runs before handing over (default 320)"
        default: "320"
  schedule:
    # restarts the watcher if it ever stopped; while one is running, the scheduled run ends at once (job "needed")
    - cron: "37 */2 * * *"

permissions:
  contents: read
  actions: read   # to see whether a watcher is already running (job "needed")

defaults:
  run:
    shell: bash   # -eo pipefail: a failing command inside a pipe (e.g. `… | tee`) fails the step

jobs:
  # The schedule only restarts a watcher that stopped: with one running, a scheduled run ends here, green. (Hand-overs
  # and the keeper start a watcher only when needed, so they always go ahead.) No concurrency group: GitHub would cancel
  # the waiting runs, leaving grey runs in the history.
  needed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Is a watcher already running?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          others=0
          if [ "$EVENT" = "schedule" ]; then
            others=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow live.yml --limit 20 --json databaseId,status \
                     --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length" || echo 0)
          fi
          if [ "$others" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "a watcher is already running"; fi

  watch:
    needs: needed
    if: needs.needed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:   # the publishing token is given only to the steps that use it (not to pip install)
      FIRECAL_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Check the publishing key
        id: key
        continue-on-error: true   # reported here; without a key the watcher can't run (browsers still read NASA directly)
        env:
          GH_TOKEN: ${{ secrets.FIRECAL_PUBLISH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The FIRECAL_PUBLISH_TOKEN secret is missing; the watcher can't start website builds."
            exit 1
          fi
          # a real call: an expired or revoked key fails here, not hours later ("release not found" is a fine first run)
          if ! gh release view firecal-data --repo "$GITHUB_REPOSITORY" > /dev/null 2> key.err && ! grep -qi "not found" key.err; then
            echo "::error::GitHub rejected the FIRECAL_PUBLISH_TOKEN secret (expired or revoked?): $(cat key.err)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: steps.key.outcome == 'success'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        if: steps.key.outcome == 'success'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        id: install
        if: steps.key.outcome == 'success'
        continue-on-error: true
        run: pip install -r requirements.txt
      - name: Watch NASA and rebuild the website when it has newer fires
        id: watch
        if: steps.install.outcome == 'success'
        continue-on-error: true   # never fails the run; without a successful watch there's no hand-over (below)
        env:
          GH_TOKEN: ${{ secrets.FIRECAL_PUBLISH_TOKEN }}
          MINUTES: ${{ inputs.minutes || '320' }}
        run: python pipeline/keeper.py --watch "$MINUTES"
      - name: Hand over to the next watcher
        # only after a watch that ran: if installing or starting fails, the 2-hourly schedule restarts the chain
        # later instead of a failing run starting the next one at once, forever (a cancelled watcher isn't replaced)
        if: ${{ steps.watch.outcome == 'success' }}
        continue-on-error: true   # the 2-hourly schedule and every website build restart the watcher anyway
        env:
          GH_TOKEN: ${{ secrets.FIRECAL_PUBLISH_TOKEN }}
        run: gh workflow run live.yml
