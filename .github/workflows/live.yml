# Keeps the website's live fires fresh around the clock, with no laptop and without relying on GitHub's scheduled
# runs (which GitHub drops more often than not). One watcher at a time checks NASA's near-real-time feed every 5
# minutes and asks for a website rebuild when NASA has newer data (pipeline/keeper.py). After ~5.5 hours it starts
# its own successor and ends. The guardian (guard.yml) restarts it if it ever stops, and it restarts the guardian;
# the schedule below, every website build and the local server are extra restarters.
# Never fails: problems are reported as warnings and the chain carries on.
# Runs as the owner via the FIRECAL_PUBLISH_TOKEN secret (fine-grained, this repository only).
name: Keep live fires fresh

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this watcher runs before handing over (default 320)"
        default: "320"
  schedule:
    - cron: "37 */2 * * *"   # a last-resort restart; while a watcher runs it ends at once (job "needed")

permissions:
  contents: read
  actions: read   # to see whether a watcher is already running (job "needed")

defaults:
  run:
    shell: bash   # -eo pipefail: a failing command inside a pipe (e.g. `… | tee`) fails the step

jobs:
  # No concurrency group (GitHub would cancel waiting runs, leaving grey runs): this job keeps it to one watcher.
  needed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Is a watcher already running?
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WORKFLOW: live.yml
        run: |
          # One chain at a time. A hand-over overlaps for a moment (the previous run is still finishing), so wait up to 5
          # minutes for older runs; one still working after that means this run is a second chain: it ends here and doesn't
          # hand over. A scheduled run (a last-resort restart) doesn't wait. If GitHub can't list runs, go ahead.
          run=true
          if [ "$EVENT" = "schedule" ]; then end=$(date +%s); else end=$(( $(date +%s) + 300 )); fi
          while :; do
            older=$(timeout 60 gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --limit 20 --json databaseId,status \
                    --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID and .status != \"completed\")] | length") || { echo "couldn't list runs; going ahead"; older=0; }
            [ "$older" = "0" ] && break
            if [ "$(date +%s)" -ge "$end" ]; then run=false; echo "an older run is still working; this one ends here"; break; fi
            sleep 20
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"

  watch:
    needs: needed
    if: needs.needed.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:   # the publishing token is given only to the steps that use it (not to pip install)
      FIRECAL_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Check the publishing key
        id: key
        continue-on-error: true   # reported here; without a key the watcher can't run (browsers still read NASA directly)
        env:
          GH_TOKEN: ${{ secrets.FIRECAL_PUBLISH_TOKEN }}
          WHAT: "the watcher can't start website builds."
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ -z "$GH_TOKEN" ]; then echo "::error::The FIRECAL_PUBLISH_TOKEN secret is missing; $WHAT"; exit 1; fi
          # a real call, retried through GitHub hiccups: only a 401/403 means the key itself was rejected
          # ("release not found" is a fine first run)
          ok=""; out=""
          for wait in 10 30 60 0; do
            if out=$(timeout 60 gh release view firecal-data --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then ok=1; break; fi
            if printf '%s' "$out" | grep -qi "not found"; then ok=1; break; fi
            if printf '%s' "$out" | grep -qiE "HTTP 40[13]|bad credentials|resource not accessible"; then
              echo "::error::GitHub rejected the FIRECAL_PUBLISH_TOKEN secret (expired or revoked?): $out"; exit 1
            fi
            [ "$wait" = 0 ] && break
            sleep "$wait"
          done
          [ -n "$ok" ] || echo "::warning::GitHub didn't answer the key check ($out); going ahead"
          # when the key expires (GitHub reports it on every call): logged on every run, a warning a month ahead; never fails
          exp=$(timeout 60 gh api -i "repos/$GITHUB_REPOSITORY" 2>/dev/null | tr -d '\r' | sed -n 's/^[Gg]ithub-[Aa]uthentication-[Tt]oken-[Ee]xpiration: //p' || true)
          if [ -z "$exp" ]; then
            echo "publishing key: no expiry date reported"
          elif t=$(date -d "$exp" +%s 2>/dev/null); then
            days=$(( (t - $(date +%s)) / 86400 ))
            echo "publishing key expires $exp ($days days left)"
            if [ "$days" -lt 30 ]; then
              echo "::warning::The FIRECAL_PUBLISH_TOKEN key expires on $exp ($days days left): renew it on GitHub (Settings > Developer settings > Fine-grained tokens) and update the repository secret"
            fi
          else
            echo "publishing key expiry not readable: $exp"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        id: co
        if: steps.key.outcome == 'success'
        continue-on-error: true
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        id: py
        if: steps.co.outcome == 'success'
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        id: install
        if: steps.py.outcome == 'success'
        continue-on-error: true
        run: for i in 1 2 3; do pip install -r requirements.txt && break; [ "$i" = 3 ] && exit 1; sleep $((i * 20)); done
      - name: Watch NASA and rebuild the website when it has newer fires
        id: watch
        if: steps.install.outcome == 'success'
        continue-on-error: true   # never fails the run; the hand-over below follows in any case
        timeout-minutes: 325      # a hard stop well inside the job's limit, so the hand-over always gets its turn
        env:
          GH_TOKEN: ${{ secrets.FIRECAL_PUBLISH_TOKEN }}
          FIRECAL_GH_TIMEOUT: "90"   # one stuck GitHub call can't hold the watcher for long
          MINUTES: ${{ inputs.minutes || '320' }}
        run: python pipeline/keeper.py --watch "$MINUTES"
      - name: Hand over to the next watcher
        # Always (unless you cancel this run): the chain must never depend on GitHub's schedule. GitHub API hiccups
        # are retried for a few minutes.
        if: ${{ !cancelled() && steps.key.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FIRECAL_PUBLISH_TOKEN }}
          WATCH: ${{ steps.watch.outcome }}
        run: |
          # a watch that failed early (not one stopped near the end of its time) waits, so a lasting problem can't loop fast
          if [ "$WATCH" != "success" ] && [ $(( $(date +%s) - ${JOB_START:-0} )) -lt 18000 ]; then
            echo "the watch ended early ($WATCH); handing over in 10 minutes"; sleep 600
          fi
          for wait in 20 40 80 0; do
            timeout 60 gh workflow run live.yml --repo "$GITHUB_REPOSITORY" && echo "next watcher started" && exit 0
            [ "$wait" = 0 ] && break
            echo "GitHub didn't accept the hand-over; trying again in $wait s"; sleep "$wait"
          done
          echo "::warning::could not start the next watcher; the guardian restarts it within 10 minutes"
