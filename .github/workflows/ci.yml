# Tests, and a build + smoke test of the Docker image (the server edition), on every push and pull request.
# CI never turns red: every check runs and reports its result on the run (a warning and a summary table), and
# broken code is stopped earlier: before each push, the same checks run on the owner's computer (pre-push hook),
# and the website build (pages.yml) publishes nothing whose tests fail.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -eo pipefail: a failing command inside a pipe (e.g. `… | tee`) fails the step

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        id: co
        continue-on-error: true
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        id: py
        if: steps.co.outcome == 'success'
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        id: install
        if: steps.py.outcome == 'success'
        continue-on-error: true
        run: for i in 1 2 3; do pip install -r requirements-dev.txt && break; [ "$i" = 3 ] && exit 1; sleep $((i * 20)); done
      - name: Tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: python -m pytest -q tests 2>&1 | tee pytest.log
      - name: Report
        if: ${{ !cancelled() }}
        env:
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          result=$(tail -1 pytest.log 2>/dev/null || echo "not run")
          { echo "### Tests"; echo "| install | tests | result |"; echo "|---|---|---|"; echo "| $INSTALL | $TESTS | $result |"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TESTS" != "success" ]; then echo "::warning::Tests did not pass ($result): the website keeps its last good version until they do"; fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        id: co
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Build image
        id: build
        if: steps.co.outcome == 'success'
        continue-on-error: true
        run: |
          # the build downloads Python packages: a network hiccup is retried
          for i in 1 2 3; do docker build -t firecal:ci . && break; [ "$i" = 3 ] && exit 1; sleep $((i * 30)); done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        id: py
        if: steps.build.outcome == 'success'
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Synthetic country for the smoke test
        id: data
        if: steps.py.outcome == 'success'
        continue-on-error: true
        run: |
          for i in 1 2 3; do pip install -r requirements-dev.txt && break; [ "$i" = 3 ] && exit 1; sleep $((i * 20)); done
          mkdir -p smoke && python -c "import pathlib; from tests.test_analysis import make_country; make_country(pathlib.Path('smoke'), 'Nigeria', seed=1)"
          sudo chown -R 1000:1000 smoke   # the container runs as uid 1000
      - name: Run container
        id: run
        if: steps.data.outcome == 'success'
        continue-on-error: true
        run: docker run -d --name firecal -p 8765:8765 -e FIRECAL_NO_LIVE=1 -v "$PWD/smoke:/data" firecal:ci
      - name: Smoke test
        id: smoke
        if: steps.run.outcome == 'success'
        continue-on-error: true
        run: |
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' firecal)" = healthy ] && break
            sleep 2
          done
          docker inspect -f 'health={{.State.Health.Status}} user={{.Config.User}}' firecal
          test "$(docker inspect -f '{{.State.Health.Status}}' firecal)" = healthy
          # (responses are read whole first: `curl | grep -q` fails at random under pipefail, as grep stops reading early)
          page=$(curl -sf localhost:8765/); grep -q 'app.js?v=' <<<"$page"
          curl -sf localhost:8765/api/meta | python -c "import json,sys; m=json.load(sys.stdin); assert len(m['countries']) > 200 and [c['id'] for c in m['countries'] if c['ready']] == ['Nigeria'], m['countries'][:3]"
          curl -sf "localhost:8765/api/calendar?country=Nigeria" | python -c "import json,sys; d=json.load(sys.stdin); assert abs(d['harmonization']['k_all'] - 3) < 0.1, d['harmonization']['k_all']"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8765/api/calendar?country=Ghana')" = 202
          where=$(curl -sf "localhost:8765/api/locate?lon=33.4&lat=35.1"); grep -q Cyprus <<<"$where"
          curl -sf localhost:8765/places/index.json | python -c "import json,sys; assert json.load(sys.stdin)['deg'] == 2"
          head=$(curl -sfI localhost:8765/); grep -qi '^x-frame-options: DENY' <<<"$head"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' localhost:8765/api/health)" = 400  # DNS rebinding refused
          echo "smoke test passed"
      - name: Container logs
        if: steps.run.outcome == 'success'
        run: docker logs firecal || true
      - name: Report
        if: ${{ !cancelled() }}
        env:
          BUILD: ${{ steps.build.outcome }}
          DATA: ${{ steps.data.outcome }}
          RUN: ${{ steps.run.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          { echo "### Docker image"; echo "| build | test data | container | smoke test |"; echo "|---|---|---|---|"; echo "| $BUILD | $DATA | $RUN | $SMOKE |"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SMOKE" != "success" ]; then echo "::warning::Docker image check incomplete (build $BUILD, test data $DATA, container $RUN, smoke test $SMOKE)"; fi
