# Publishes the FireCal website (static edition) to GitHub Pages.
# Runs when code changes, when pipeline/world.py publishes new countries, when the live-fire watcher
# (live.yml) sees newer NASA fires, and every 15 minutes on GitHub's best-effort schedule. Runs that
# find nothing new exit in seconds.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # off-peak minutes: GitHub delays or drops scheduled runs at the busy :00/:15/:30/:45 marks
    - cron: "11,26,41,56 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # to see whether an older website run is still working (job "queue")

defaults:
  run:
    shell: bash   # -eo pipefail: a failing command inside a pipe (e.g. `… | tee`) fails the step

jobs:
  # One website run at a time, without cancelling anyone: GitHub's concurrency groups cancel a waiting run when a
  # newer one arrives (red/grey runs, and a push could go unpublished), so each run waits here for older ones instead.
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for older website runs to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 140); do  # up to ~70 minutes, then go ahead anyway
            older=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --limit 30 --json databaseId,status \
                    --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID and .status != \"completed\")] | length" || echo 0)
            [ "$older" = "0" ] && exit 0
            [ "$i" = 1 ] && echo "waiting for $older older website run(s) to finish"
            sleep 30
          done
          echo "::notice::older website runs still busy after 70 minutes; going ahead"

  publish:
    needs: queue
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Fingerprint data, code and NASA feed
        id: fp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +o pipefail  # a lookup that fails (NASA down, no release yet) yields a fallback fingerprint, not a failed build
          data=$(gh release view firecal-data --json assets --jq '[.assets[] | .name + "@" + .updatedAt] | sort | join(",")' 2>/dev/null | sha1sum | cut -c1-16)
          code=$(git ls-files -s app pipeline tests requirements.txt requirements-dev.txt .github/workflows/pages.yml | sha1sum | cut -c1-16)
          # NASA's data, identified by its file size on the newest server (app/feeds.py): a re-stamped,
          # unchanged file doesn't trigger a rebuild
          nasa=$(python3 app/feeds.py 2>/dev/null | cut -d' ' -f2 | sha1sum | cut -c1-16)
          echo "site=site-$data-$code" >> "$GITHUB_OUTPUT"
          echo "published=published-$data-$code-$nasa" >> "$GITHUB_OUTPUT"

      - name: Already published this exact state?
        id: done
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .published
          key: ${{ steps.fp.outputs.published }}
          lookup-only: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        if: steps.done.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        if: steps.done.outputs.cache-hit != 'true'
        run: pip install -r requirements-dev.txt

      - name: Restore built site
        id: site
        if: steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            site
            build
          key: ${{ steps.fp.outputs.site }}

      # Nothing below fails the run: if a step can't finish (NASA or GitHub briefly unreachable, a bad commit), the
      # website keeps its last good version, the run says why in a warning, and the next run (≤ 15 min) tries again.
      - name: Test (code or data changed)
        id: test
        if: steps.done.outputs.cache-hit != 'true' && steps.site.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python -m pytest -q tests

      - name: Build site from published countries
        id: build
        if: steps.done.outputs.cache-hit != 'true' && steps.site.outputs.cache-hit != 'true' && steps.test.outcome != 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl data/countries
          # GitHub's API sometimes answers 500 for a moment: retry, keeping files already downloaded
          for i in 1 2 3 4 5; do
            gh release download firecal-data --dir dl --pattern '*.parquet' --pattern '*.built.json' --pattern 'unavailable.json' --skip-existing && break
            [ "$i" = 5 ] && exit 1; echo "download interrupted; retrying"; sleep $((i * 20))
          done
          [ -f dl/unavailable.json ] && mv dl/unavailable.json data/unavailable.json
          for f in dl/*.grid_daily.parquet; do
            c=$(basename "$f" .grid_daily.parquet); mkdir -p "data/countries/$c"
            mv "$f" "data/countries/$c/grid_daily.parquet"
            [ -f "dl/$c.static_cells.parquet" ] && mv "dl/$c.static_cells.parquet" "data/countries/$c/static_cells.parquet"
            # which NASA yearly archive the country holds: the record ends at the earliest of all (analysis.Store.end)
            [ -f "dl/$c.built.json" ] && mv "dl/$c.built.json" "data/countries/$c/built.json"
          done
          python pipeline/static_site.py --out site --build build

      - name: Save built site
        if: steps.done.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            site
            build
          key: ${{ steps.fp.outputs.site }}

      - name: Refresh live fires
        id: live
        if: steps.done.outputs.cache-hit != 'true' && steps.test.outcome != 'failure' && steps.build.outcome != 'failure'
        continue-on-error: true
        # if NASA can't be reached, keep the live fires already published and deploy everything else
        run: python pipeline/live.py --site site --build build --force --keep-from "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
        id: configure
        if: steps.done.outputs.cache-hit != 'true' && steps.test.outcome != 'failure' && steps.build.outcome != 'failure' && steps.live.outcome == 'success'
        continue-on-error: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        id: upload
        if: steps.done.outputs.cache-hit != 'true' && steps.test.outcome != 'failure' && steps.build.outcome != 'failure' && steps.live.outcome == 'success' && steps.configure.outcome == 'success'
        continue-on-error: true
        with:
          path: site

      - name: Deploy
        id: deploy
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

      - name: Wait before trying the deploy again
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Deploy (second try)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

      - name: Remember this state
        id: deployed
        if: steps.deploy.outcome == 'success' || steps.deploy2.outcome == 'success'
        run: mkdir -p .published && date -u > .published/at

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        if: steps.deployed.outcome == 'success'
        continue-on-error: true
        with:
          path: .published
          key: ${{ steps.fp.outputs.published }}

      - name: Report
        if: steps.done.outputs.cache-hit != 'true' && steps.deployed.outcome != 'success'
        env:
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          LIVE: ${{ steps.live.outcome }}
          DEPLOY: ${{ steps.deploy2.outcome || steps.deploy.outcome }}
        run: |
          echo "::warning::Not published this time (tests: $TEST, build: $BUILD, live fires: $LIVE, deploy: $DEPLOY); the website keeps its last good version and the next run tries again"

      - name: Make sure the live-fire watcher is running
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.FIRECAL_PUBLISH_TOKEN }}
        run: |
          # .github/workflows/live.yml keeps the live fires fresh around the clock; restart it if it stopped
          [ -n "$GH_TOKEN" ] || exit 0
          active=$(gh run list --workflow live.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length' || echo 1)
          [ "$active" = "0" ] && gh workflow run live.yml && echo "started the live-fire watcher" || true
