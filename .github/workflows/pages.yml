# Publishes the FireCal website (static edition) to GitHub Pages.
# Runs when code changes, when pipeline/world.py publishes new countries, when the live-fire watcher
# (live.yml) sees newer NASA fires, and every 15 minutes on GitHub's best-effort schedule. Runs that
# find nothing new exit in seconds.
# Never fails: if anything can't finish (NASA, GitHub or PyPI briefly unreachable, a commit whose tests fail), the
# website keeps its last good version (with fresh live fires where possible), the run says why in a warning, and
# the next run tries again.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # off-peak minutes: GitHub delays or drops scheduled runs at the busy :00/:15/:30/:45 marks
    - cron: "11,26,41,56 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # to see whether an older website run is still working (job "queue")

defaults:
  run:
    shell: bash   # -eo pipefail: a failing command inside a pipe (e.g. `… | tee`) fails the step

jobs:
  # One website run at a time, without cancelling anyone: GitHub's concurrency groups cancel a waiting run when a
  # newer one arrives (red/grey runs, and a push could go unpublished), so each run waits here for older ones instead.
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for older website runs to finish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$(( $(date +%s) + 65 * 60 ))  # by the clock, well inside the job's limit; then go ahead anyway
          while [ "$(date +%s)" -lt "$end" ]; do
            older=$(timeout 60 gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --limit 30 --json databaseId,status \
                    --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID and .status != \"completed\")] | length" || echo 0)
            [ "$older" = "0" ] && exit 0
            echo "waiting for $older older website run(s) to finish"
            sleep 30
          done
          echo "::notice::older website runs still busy after 65 minutes; going ahead"

  publish:
    needs: queue
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        id: co
        continue-on-error: true
        with:
          persist-credentials: false

      - name: Fingerprint data, code and NASA feed
        id: fp
        if: steps.co.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +o pipefail  # a lookup that fails yields a one-off fingerprint (nothing cached is reused), not a failed run
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          if assets=$(timeout 120 gh release view firecal-data --json assets --jq '[.assets[] | .name + "@" + .updatedAt] | sort | join(",")'); then
            data=$(printf '%s' "$assets" | sha1sum | cut -c1-16)
          else
            data="nocache-$GITHUB_RUN_ID"
          fi
          code=$(git ls-files -s app pipeline tests requirements.txt requirements-dev.txt .github/workflows/pages.yml | sha1sum | cut -c1-16)
          # NASA's data, identified by its file size (app/feeds.py), told which data the live site already shows so an
          # old file re-stamped on one server can't hide new data on the other
          known=$(curl -sf --max-time 60 "${site}data/live/meta.json" \
                  | python3 -c 'import json,sys; m=json.load(sys.stdin); print(m["source_bytes"], m["source_last_modified"])' 2>/dev/null || true)
          if line=$(timeout 300 python3 app/feeds.py $known 2>/dev/null); then
            nasa=$(printf '%s' "$line" | cut -d' ' -f2 | sha1sum | cut -c1-16)
          else
            nasa="unknown-$GITHUB_RUN_ID"
          fi
          echo "site_url=$site" >> "$GITHUB_OUTPUT"
          echo "site=site-$data-$code" >> "$GITHUB_OUTPUT"
          echo "published=published-$data-$code-$nasa" >> "$GITHUB_OUTPUT"

      - name: Already published this exact state?
        id: done
        if: steps.fp.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .published
          key: ${{ steps.fp.outputs.published }}
          lookup-only: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        id: py
        if: steps.fp.outcome == 'success' && steps.done.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        id: install
        if: steps.py.outcome == 'success'
        continue-on-error: true
        run: for i in 1 2 3; do pip install -r requirements-dev.txt && break; [ "$i" = 3 ] && exit 1; sleep $((i * 20)); done

      - name: Restore built site
        id: site
        if: steps.install.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            site
            build
          key: ${{ steps.fp.outputs.site }}
          # no exact match: the most recent site, so live fires can still be refreshed if this commit fails its tests
          restore-keys: site-

      - name: Test (code or data changed)
        id: test
        if: steps.install.outcome == 'success' && steps.site.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python -m pytest -q tests

      - name: Build site from published countries
        id: build
        if: steps.test.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl data/countries
          # GitHub's API sometimes answers 500 for a moment: retry, keeping files already downloaded
          for i in 1 2 3 4 5; do
            gh release download firecal-data --dir dl --pattern '*.parquet' --pattern '*.built.json' --pattern 'unavailable.json' --skip-existing && break
            [ "$i" = 5 ] && exit 1; echo "download interrupted; retrying"; sleep $((i * 20))
          done
          [ -f dl/unavailable.json ] && mv dl/unavailable.json data/unavailable.json
          for f in dl/*.grid_daily.parquet; do
            c=$(basename "$f" .grid_daily.parquet); mkdir -p "data/countries/$c"
            mv "$f" "data/countries/$c/grid_daily.parquet"
            [ -f "dl/$c.static_cells.parquet" ] && mv "dl/$c.static_cells.parquet" "data/countries/$c/static_cells.parquet"
            # which NASA yearly archive the country holds: the record ends at the earliest of all (analysis.Store.end)
            [ -f "dl/$c.built.json" ] && mv "dl/$c.built.json" "data/countries/$c/built.json"
          done
          python pipeline/static_site.py --out site --build build

      - name: Save built site
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            site
            build
          key: ${{ steps.fp.outputs.site }}

      - name: Refresh live fires
        id: live
        # on this commit's site, or (if its tests failed) on the last good one: live fires never stop updating
        if: steps.install.outcome == 'success' && steps.build.outcome != 'failure' && hashFiles('site/index.html') != ''
        continue-on-error: true
        # if NASA can't be reached, keep the live fires already published and deploy everything else
        run: python pipeline/live.py --site site --build build --force --keep-from "${{ steps.fp.outputs.site_url }}"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
        id: configure
        if: steps.live.outcome == 'success'
        continue-on-error: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        id: upload
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        with:
          path: site

      - name: Deploy
        id: deploy
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

      - name: Wait before trying the deploy again
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Deploy (second try)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

      # Only a state that was fully published is remembered: this commit's code (built now or restored exactly) and
      # NASA's data as fingerprinted (not the fallback copy kept when NASA couldn't be reached).
      - name: Remember this state
        id: deployed
        if: >-
          (steps.deploy.outcome == 'success' || steps.deploy2.outcome == 'success')
          && (steps.build.outcome == 'success' || steps.site.outputs.cache-hit == 'true')
          && hashFiles('build/live_kept') == ''
        run: mkdir -p .published && date -u > .published/at

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        if: steps.deployed.outcome == 'success'
        continue-on-error: true
        with:
          path: .published
          key: ${{ steps.fp.outputs.published }}

      - name: Report
        if: ${{ !cancelled() && steps.done.outputs.cache-hit != 'true' && steps.deployed.outcome != 'success' }}
        env:
          CHECKOUT: ${{ steps.co.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          LIVE: ${{ steps.live.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          DEPLOY: ${{ steps.deploy2.outcome || steps.deploy.outcome }}
        run: |
          kept=""; [ -f build/live_kept ] && kept=" (NASA unreachable: the published live fires were kept)"
          echo "::warning::Not fully published this time$kept (checkout $CHECKOUT, install $INSTALL, tests $TEST, build $BUILD, live fires $LIVE, configure $CONFIGURE, upload $UPLOAD, deploy $DEPLOY); the next run tries again"

      - name: Make sure the live-fire watcher is running
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FIRECAL_PUBLISH_TOKEN }}
        run: |
          # .github/workflows/live.yml keeps the live fires fresh around the clock; restart it if it stopped
          [ -n "$GH_TOKEN" ] || exit 0
          active=$(timeout 60 gh run list --repo "$GITHUB_REPOSITORY" --workflow live.yml --limit 10 --json status \
                   --jq '[.[] | select(.status != "completed")] | length' || echo 1)
          if [ "$active" = "0" ]; then timeout 60 gh workflow run live.yml --repo "$GITHUB_REPOSITORY" && echo "started the live-fire watcher" || true; fi
